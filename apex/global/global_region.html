<style>
/* =====================================================================
   TEMA GLOBAL "SISTEM INFORMASI AKADEMIK" - gelap, emas, animasi 3D  (v2)
   ===================================================================== */
@import url('https://fonts.googleapis.com/css2?family=Cinzel:wght@600;700&family=Inter:wght@300;400;500;600&display=swap');

:root{
  --sk-gold:#d9b45a; --sk-gold-2:#f6e0a1; --sk-gold-3:#8f6d1f;
  --sk-ink:#050810; --sk-panel:#0e1530;
  --sk-txt:#e9ecf5; --sk-mut:#8f98b0; --sk-line:rgba(217,180,90,.22);
}

/* ---------- Latar dasar + latar bergerak (sama seperti Home) ---------- */
html{ background:var(--sk-ink) !important; }
body, .t-Body, .t-Body-main, .t-Body-content, .t-Body-contentInner{
  background:transparent !important; color:var(--sk-txt); font-family:'Inter',system-ui,'Segoe UI',Arial,sans-serif; }
body::before{ content:""; position:fixed; inset:-6%; z-index:-1; pointer-events:none;
  background:
    radial-gradient(620px 440px at 86% 2%,  rgba(201,162,74,.26), transparent 70%),
    radial-gradient(560px 460px at 2% 98%,  rgba(75,60,196,.34),  transparent 70%),
    radial-gradient(440px 380px at 100% 62%, rgba(14,143,159,.20), transparent 70%),
    radial-gradient(900px 500px at 78% -10%, #16224a, transparent 60%);
  animation:skDrift 18s ease-in-out infinite alternate; }
@keyframes skDrift{ from{ transform:translate3d(0,0,0) scale(1);} to{ transform:translate3d(-2.5%,2%,0) scale(1.1);} }
body::after{ content:""; position:fixed; left:0; right:0; bottom:0; height:60vh; z-index:-1; pointer-events:none; opacity:.5;
  background-image:linear-gradient(rgba(217,180,90,.08) 1px,transparent 1px),linear-gradient(90deg,rgba(217,180,90,.08) 1px,transparent 1px);
  background-size:56px 56px; transform:perspective(700px) rotateX(58deg); transform-origin:50% 100%;
  -webkit-mask-image:linear-gradient(to top,#000 0%,transparent 72%); mask-image:linear-gradient(to top,#000 0%,transparent 72%);
  animation:skGrid 14s linear infinite; }
@keyframes skGrid{ to{ background-position:0 56px,56px 0; } }

h1,h2,h3,h4,.t-Region-title,.t-BreadcrumbRegion-title{ font-family:'Cinzel',Georgia,serif; }
body a{ color:var(--sk-gold-2); } body a:hover{ color:#fff; }

/* ---------- Header atas ---------- */
.t-Header{ background:linear-gradient(90deg,#060912,#0d1430 60%,#120f2b) !important; border-bottom:1px solid var(--sk-line) !important; box-shadow:0 10px 30px -12px rgba(0,0,0,.8); }
.t-Header .t-Header-logo-link, .t-Header-logo-link, .t-Header .t-Button, .t-Header-nav .t-Button, .t-Header .a-Menu-label{ color:var(--sk-gold-2) !important; font-family:'Cinzel',Georgia,serif; letter-spacing:.05em; }
.t-Header .t-Button--header, .t-Header .t-Button--headerUser{ background:transparent !important; border:0 !important; box-shadow:none !important; }

/* ---------- Menu samping ---------- */
.t-Body-nav{ background:linear-gradient(180deg,#070b17,#0a1028) !important; border-right:1px solid var(--sk-line) !important; }
.t-TreeNav, .t-TreeNav .a-TreeView{ background:transparent !important; }
.t-TreeNav .a-TreeView-content{ color:#cfd5e6 !important; background:transparent !important; border-left:3px solid transparent; transition:all .25s ease; }
.t-TreeNav .a-TreeView-label, .t-TreeNav .a-TreeView-content a{ color:#cfd5e6 !important; }
.t-TreeNav .a-TreeView-content .fa, .t-TreeNav .a-TreeView-content .a-Icon, .t-TreeNav .a-TreeView-content [class*="icon"]{ color:var(--sk-gold) !important; transition:transform .25s; }
.t-TreeNav .a-TreeView-content:hover, .t-TreeNav .a-TreeView-content.is-hover{
  background:linear-gradient(90deg,rgba(217,180,90,.16),transparent) !important; border-left-color:var(--sk-gold); }
.t-TreeNav .a-TreeView-content:hover .a-TreeView-label, .t-TreeNav .a-TreeView-content:hover a{ color:#fff !important; }
.t-TreeNav .a-TreeView-content:hover .fa, .t-TreeNav .a-TreeView-content:hover .a-Icon{ transform:scale(1.18); }
.t-TreeNav .is-current > .a-TreeView-content, .t-TreeNav .a-TreeView-content.is-current{
  background:linear-gradient(90deg,rgba(217,180,90,.28),rgba(217,180,90,.03)) !important; border-left-color:var(--sk-gold-2); box-shadow:inset 0 0 24px rgba(217,180,90,.12); }
.t-TreeNav .is-current > .a-TreeView-content .a-TreeView-label, .t-TreeNav .is-current > .a-TreeView-content a{ color:#fff !important; font-weight:600; }

/* ---------- Judul halaman (TIDAK mengubah position .t-Body-title: dipasang APEX secara fixed) ---------- */
.t-Body-title{ background:#080c1c !important; border:0 !important; box-shadow:0 12px 30px -16px rgba(0,0,0,.9) !important; }
.t-BreadcrumbRegion{ position:relative; overflow:hidden; background:linear-gradient(100deg,#111a3d,#080c1c 70%) !important;
  border:0 !important; border-bottom:1px solid var(--sk-line) !important; box-shadow:none !important; }
.t-BreadcrumbRegion-body{ background:transparent !important; }
.t-BreadcrumbRegion-title{ margin:0 !important; font-weight:700 !important; letter-spacing:.04em;
  background:linear-gradient(100deg,var(--sk-gold-3),var(--sk-gold) 30%,var(--sk-gold-2) 55%,var(--sk-gold) 80%,var(--sk-gold-3)); background-size:220% auto;
  -webkit-background-clip:text; background-clip:text; color:transparent !important; -webkit-text-fill-color:transparent; animation:skShine 6s linear infinite; }
@keyframes skShine{ to{ background-position:220% center; } }
.t-Breadcrumb-label, .t-Breadcrumb-item a{ color:var(--sk-mut) !important; }
/* garis emas bergerak di bawah judul */
.t-BreadcrumbRegion::after{ content:""; position:absolute; left:0; right:0; bottom:0; height:2px; pointer-events:none;
  background:linear-gradient(90deg,transparent,var(--sk-gold),var(--sk-gold-2),var(--sk-gold),transparent); background-size:200% 100%; animation:skLine 5s linear infinite; }
@keyframes skLine{ to{ background-position:200% 0; } }
/* dua cincin emas 3D berputar di sisi kanan judul */
.t-BreadcrumbRegion::before, .t-BreadcrumbRegion-body::after{ content:""; position:absolute; top:50%; border-radius:50%; pointer-events:none;
  border:2px solid rgba(217,180,90,.85); box-shadow:0 0 16px rgba(217,180,90,.4), inset 0 0 12px rgba(217,180,90,.25); }
.t-BreadcrumbRegion::before{ right:64px; width:70px; height:70px; margin-top:-35px; animation:skRingA 9s linear infinite; }
.t-BreadcrumbRegion-body::after{ right:76px; width:46px; height:46px; margin-top:-23px; border-color:rgba(246,224,161,.8); animation:skRingB 6s linear infinite; }
@keyframes skRingA{ from{ transform:perspective(260px) rotateX(68deg) rotateZ(0);} to{ transform:perspective(260px) rotateX(68deg) rotateZ(360deg);} }
@keyframes skRingB{ from{ transform:perspective(260px) rotateY(68deg) rotateZ(0);} to{ transform:perspective(260px) rotateY(68deg) rotateZ(-360deg);} }

/* ---------- Region / kartu ---------- */
.t-Region, .t-Region--scrollBody, .t-ContentBlock, .t-Card{
  background:linear-gradient(160deg,rgba(21,29,56,.88),rgba(9,13,28,.94)) !important; border:1px solid var(--sk-line) !important; border-radius:18px !important;
  box-shadow:0 26px 50px -28px rgba(0,0,0,.95) !important; color:var(--sk-txt) !important;
  transition:transform .3s ease, box-shadow .3s ease; animation:skRise .8s cubic-bezier(.2,.7,.2,1) backwards; }
.t-Region:hover{ transform:translateY(-3px); box-shadow:0 32px 60px -26px rgba(217,180,90,.3) !important; }
.t-Region-header, .t-Region-headerItems{ background:transparent !important; border-bottom:1px solid var(--sk-line) !important; }
.t-Region-title, .t-Region-header .t-Region-title{ color:var(--sk-gold-2) !important; letter-spacing:.05em; }
.t-Region-body{ color:var(--sk-txt); }
@keyframes skRise{ from{ opacity:0; transform:translateY(34px) rotateX(14deg);} to{ opacity:1; transform:none; } }

/* ---------- Interactive Report ---------- */
.a-IRR-container, .a-IRR, .a-IRR-tableContainer, .a-IRR-toolbar, .a-IRR-controlsContainer{ background:transparent !important; border-color:var(--sk-line) !important; color:var(--sk-txt) !important; }
.a-IRR-table{ border-collapse:separate !important; border-spacing:0 !important; border:0 !important; }
.a-IRR-table th, .a-IRR-table td{ border-color:rgba(217,180,90,.12) !important; border-left-width:0 !important; border-right-width:0 !important; border-top-width:0 !important; }
.a-IRR-header, .a-IRR-table th{ background:linear-gradient(180deg,#1a2350,#101839) !important; color:var(--sk-gold-2) !important; border-bottom:2px solid var(--sk-gold) !important;
  font-family:'Cinzel',Georgia,serif; font-size:12.5px; letter-spacing:.1em; text-transform:uppercase; }
.a-IRR-header a, .a-IRR-headerLink, .a-IRR-header .a-IRR-headerLabel{ color:var(--sk-gold-2) !important; }
.a-IRR-table td{ background:transparent !important; color:var(--sk-txt) !important; border-bottom:1px solid rgba(217,180,90,.1) !important; transition:background .2s; }
.a-IRR-table tr:nth-child(even) td{ background:rgba(255,255,255,.025) !important; }
.a-IRR-table tr:hover td{ background:linear-gradient(90deg,rgba(217,180,90,.16),rgba(217,180,90,.04)) !important; }
.a-IRR-table td a, .a-IRR-table td .fa, .a-IRR-table td .a-Icon{ color:var(--sk-gold) !important; }
.a-IRR-table tr:hover td .fa, .a-IRR-table tr:hover td .a-Icon{ transform:scale(1.2); }
.a-IRR-pagination-label, .a-IRR-pagination, .a-IRR-pagination-col, .a-IRR-pagination a{ color:var(--sk-gold-2) !important; background:transparent !important; }
.a-IRR-toolbar .t-Button:not(.t-Button--hot), .a-IRR-button, .a-IRR-sortWidget{ color:var(--sk-gold-2) !important; }
.a-IRR-toolbar .t-Button--hot{ color:#1a1304 !important; }
/* baris tabel muncul bergantian */
.a-IRR-table tbody tr{ animation:skRow .55s ease backwards; }
.a-IRR-table tbody tr:nth-child(2){ animation-delay:.05s; } .a-IRR-table tbody tr:nth-child(3){ animation-delay:.10s; }
.a-IRR-table tbody tr:nth-child(4){ animation-delay:.15s; } .a-IRR-table tbody tr:nth-child(5){ animation-delay:.20s; }
.a-IRR-table tbody tr:nth-child(6){ animation-delay:.25s; } .a-IRR-table tbody tr:nth-child(7){ animation-delay:.30s; }
.a-IRR-table tbody tr:nth-child(8){ animation-delay:.35s; } .a-IRR-table tbody tr:nth-child(n+9){ animation-delay:.40s; }
@keyframes skRow{ from{ opacity:0; transform:translateX(-22px);} to{ opacity:1; transform:none; } }

/* ---------- Tombol ---------- */
.t-Button{ border-radius:11px !important; transition:transform .22s, box-shadow .22s, background .22s; font-weight:600; letter-spacing:.03em; }
.t-Button:not(.t-Button--hot):not(.t-Button--primary):not(.t-Button--danger):not(.t-Button--header):not(.t-Button--headerUser):not(.t-Button--noUI):not(.t-Button--link){
  background:rgba(255,255,255,.04) !important; color:var(--sk-gold-2) !important; border:1px solid rgba(217,180,90,.4) !important; box-shadow:none !important; }
.t-Button:not(.t-Button--hot):not(.t-Button--primary):hover{ background:rgba(217,180,90,.14) !important; transform:translateY(-2px); }
.t-Button--hot, .t-Button--primary{
  background:linear-gradient(135deg,var(--sk-gold-2),var(--sk-gold) 55%,#b98d2c) !important; color:#1a1304 !important; border:0 !important;
  box-shadow:0 10px 26px -8px rgba(217,180,90,.65), inset 0 1px 0 rgba(255,255,255,.6) !important; }
.t-Button--hot:hover, .t-Button--primary:hover{ transform:translateY(-3px) !important; box-shadow:0 18px 36px -10px rgba(217,180,90,.9), inset 0 1px 0 rgba(255,255,255,.6) !important; }
.t-Button--hot .t-Icon, .t-Button--primary .t-Icon, .t-Button--hot .fa{ color:#1a1304 !important; }
.t-Button--danger{ background:linear-gradient(135deg,#ff8a8a,#d33a3a) !important; color:#fff !important; border:0 !important; }

/* ---------- Form & input ---------- */
.t-Form-label, .t-Form-fieldContainer label, .t-Form-labelContainer label{ color:var(--sk-gold-2) !important; font-weight:500; letter-spacing:.03em; }
.apex-item-text, .apex-item-select, .apex-item-textarea, .apex-item-popup-lov, .apex-item-datepicker, .apex-item-number, select, textarea,
.t-Form-inputContainer input[type="text"], .t-Form-inputContainer input[type="number"], .t-Form-inputContainer input[type="password"],
.a-IRR-searchField input, .a-IRR-search-field input, .a-IRR-controls input[type="text"], .a-IRR-toolbar input[type="text"], .a-Menu input[type="text"]{
  background:rgba(255,255,255,.05) !important; color:var(--sk-txt) !important; border:1px solid rgba(217,180,90,.3) !important; border-radius:10px !important; transition:border-color .2s, box-shadow .2s; }
.apex-item-text:focus, .apex-item-select:focus, .apex-item-textarea:focus, .apex-item-datepicker:focus, select:focus, textarea:focus, input[type="text"]:focus{
  outline:0 !important; border-color:var(--sk-gold) !important; box-shadow:0 0 0 3px rgba(217,180,90,.2), 0 0 18px rgba(217,180,90,.25) !important; }
select option{ background:#0e1530; color:var(--sk-txt); }
.t-Form-error, .a-Form-error{ color:#ff9b9b !important; }

/* ---------- Dialog / modal ---------- */
.ui-dialog.ui-dialog--apex, .ui-dialog--apex .ui-dialog-content{ background:#0b1124 !important; color:var(--sk-txt) !important; border:1px solid var(--sk-line) !important; border-radius:18px !important; box-shadow:0 40px 90px -20px rgba(0,0,0,.95), 0 0 40px rgba(217,180,90,.12) !important; }
.ui-dialog--apex .ui-dialog-titlebar, .t-Dialog-header{ background:linear-gradient(100deg,#141d44,#0b1124) !important; border-bottom:1px solid var(--sk-line) !important; color:var(--sk-gold-2) !important; }
.ui-dialog-title{ font-family:'Cinzel',Georgia,serif; color:var(--sk-gold-2) !important; }
.t-Dialog-page, body.t-Dialog-page--standard, .t-Dialog-body, .t-Dialog-bodyWrapperOut, .t-Dialog-bodyWrapperIn{ background:#0b1124 !important; color:var(--sk-txt) !important; }
.t-Dialog-footer, .t-ButtonRegion--dialogFooter, .t-ButtonRegion{ background:transparent !important; border-top:1px solid var(--sk-line) !important; }
.t-ButtonRegion-wrap{ background:transparent !important; }
.t-Dialog-page .t-Region{ animation:none; border:0 !important; box-shadow:none !important; background:transparent !important; }
.t-Dialog-page .t-Region:hover{ transform:none; }

/* ---------- Menu popup, Actions ---------- */
.a-Menu, .a-Menu-content, .a-Menu .a-Menu-inner, .ui-menu, .a-IRR-dialog, .a-IRR-popup, .ui-widget-content, .a-PopupLOV-dialog, .a-PopupLOV-results{
  background:#0e1530 !important; color:var(--sk-txt) !important; border-color:var(--sk-line) !important; }
.a-Menu-label, .a-Menu-item, .ui-menu-item, .a-PopupLOV-link{ color:var(--sk-txt) !important; }
.a-Menu-item.is-focused, .a-Menu-item:hover, .ui-menu-item:hover, .a-PopupLOV-link:hover{ background:rgba(217,180,90,.18) !important; }

/* ---------- Footer ---------- */
.t-Footer, .t-Body-content .t-Footer{ background:transparent !important; color:#5d6580 !important; border-top:1px solid rgba(217,180,90,.12) !important; letter-spacing:.08em; }

/* ---------- Scrollbar ---------- */
*{ scrollbar-width:thin; scrollbar-color:#8f6d1f #0b1124; }
::-webkit-scrollbar{ width:10px; height:10px; } ::-webkit-scrollbar-track{ background:#0b1124; }
::-webkit-scrollbar-thumb{ background:linear-gradient(#d9b45a,#8f6d1f); border-radius:8px; }

/* ---------- Halaman login ---------- */
.t-Login-region{ background:linear-gradient(160deg,rgba(21,29,56,.9),rgba(9,13,28,.95)) !important; border:1px solid var(--sk-line) !important; border-radius:22px !important;
  box-shadow:0 40px 80px -30px rgba(0,0,0,.95), 0 0 50px rgba(217,180,90,.12) !important; }
.t-Login-title{ color:var(--sk-gold-2) !important; font-family:'Cinzel',Georgia,serif; }

@media (prefers-reduced-motion:reduce){
  body::before, body::after, .t-Region, .a-IRR-table tbody tr, .t-BreadcrumbRegion-title, .t-BreadcrumbRegion::before, .t-BreadcrumbRegion::after, .t-BreadcrumbRegion-body::after{ animation:none !important; } }
</style>
